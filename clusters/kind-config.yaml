# Локальный кластер для учебного проекта ArgoCD
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: argocd-learning
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # ArgoCD UI (port-forward альтернатива)
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      # hello-world nginx
      - containerPort: 30081
        hostPort: 30081
        protocol: TCP
