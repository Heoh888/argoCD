name: Build and deploy images

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - '.github/workflows/build-images.yaml'

env:
  FRONTEND_IMAGE: ghcr.io/heoh888/argocd-frontend
  BACKEND_IMAGE: ghcr.io/heoh888/argocd-backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: services/frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: services/backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Update image tags in manifests
        run: |
          SHA="${{ github.sha }}"
          sed -i "s|image: ghcr.io/heoh888/argocd-frontend:.*|image: ghcr.io/heoh888/argocd-frontend:${SHA}|" manifests/frontend/deployment.yaml
          sed -i "s|image: ghcr.io/heoh888/argocd-backend:.*|image: ghcr.io/heoh888/argocd-backend:${SHA}|" manifests/backend/deployment.yaml

      - name: Commit manifest updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/frontend/deployment.yaml manifests/backend/deployment.yaml
          git diff --cached --quiet && echo "No manifest changes" && exit 0
          git commit -m "ci: update image tags to ${{ github.sha }}"
          git push
