name: Build and deploy images

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - '.github/workflows/build-images.yaml'

env:
  FRONTEND_IMAGE: ghcr.io/heoh888/argocd-frontend
  BACKEND_IMAGE: ghcr.io/heoh888/argocd-backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read versions
        id: versions
        run: |
          FRONTEND_VERSION=$(tr -d '[:space:]' < services/frontend/VERSION)
          BACKEND_VERSION=$(tr -d '[:space:]' < services/backend/VERSION)
          echo "frontend=${FRONTEND_VERSION}" >> "$GITHUB_OUTPUT"
          echo "backend=${BACKEND_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: services/frontend
          platforms: linux/amd64
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ steps.versions.outputs.frontend }}
          build-args: |
            APP_VERSION=${{ steps.versions.outputs.frontend }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: services/backend
          platforms: linux/amd64
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ steps.versions.outputs.backend }}
          build-args: |
            APP_VERSION=${{ steps.versions.outputs.backend }}

      - name: Update image tags in manifests
        run: |
          FV="${{ steps.versions.outputs.frontend }}"
          BV="${{ steps.versions.outputs.backend }}"
          sed -i "s|image: ghcr.io/heoh888/argocd-frontend:.*|image: ghcr.io/heoh888/argocd-frontend:${FV}|" manifests/frontend/deployment.yaml
          sed -i "s|image: ghcr.io/heoh888/argocd-backend:.*|image: ghcr.io/heoh888/argocd-backend:${BV}|" manifests/backend/deployment.yaml

      - name: Commit manifest updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/frontend/deployment.yaml manifests/backend/deployment.yaml
          git diff --cached --quiet && echo "No manifest changes" && exit 0
          git commit -m "ci: deploy frontend ${{ steps.versions.outputs.frontend }}, backend ${{ steps.versions.outputs.backend }}"
          git push
