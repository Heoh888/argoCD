name: Build and deploy images

on:
  push:
    branches: [main, dev]
    paths:
      - 'services/**'
      - '.github/workflows/build-images.yaml'

env:
  FRONTEND_IMAGE: ghcr.io/heoh888/argocd-frontend
  BACKEND_IMAGE: ghcr.io/heoh888/argocd-backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Overlay from branch
        id: env
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "overlay=prod" >> "$GITHUB_OUTPUT"
          else
            echo "overlay=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Read versions
        id: versions
        run: |
          FRONTEND_VERSION=$(tr -d '[:space:]' < services/frontend/VERSION)
          BACKEND_VERSION=$(tr -d '[:space:]' < services/backend/VERSION)
          echo "frontend=${FRONTEND_VERSION}" >> "$GITHUB_OUTPUT"
          echo "backend=${BACKEND_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: services/frontend
          platforms: linux/amd64
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ steps.versions.outputs.frontend }}
          build-args: |
            APP_VERSION=${{ steps.versions.outputs.frontend }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: services/backend
          platforms: linux/amd64
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ steps.versions.outputs.backend }}
          build-args: |
            APP_VERSION=${{ steps.versions.outputs.backend }}

      - name: Sync manifests after image push
        run: |
          OVERLAY="${{ steps.env.outputs.overlay }}"
          FV="${{ steps.versions.outputs.frontend }}"
          BV="${{ steps.versions.outputs.backend }}"
          tr -d '[:space:]' < services/backend/VERSION > "manifests/backend/overlays/${OVERLAY}/image-tag.txt"
          tr -d '[:space:]' < services/frontend/VERSION > "manifests/frontend/overlays/${OVERLAY}/image-tag.txt"
          echo "${OVERLAY} frontend=${FV} backend=${BV} $(date -u +%Y-%m-%dT%H:%M:%SZ)" > manifests/.deploy-trigger

      - name: Commit manifest updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/.deploy-trigger manifests/backend/overlays manifests/frontend/overlays
          git diff --cached --quiet && echo "No manifest changes" && exit 0
          git commit -m "ci(${{ steps.env.outputs.overlay }}): images ready frontend ${{ steps.versions.outputs.frontend }}, backend ${{ steps.versions.outputs.backend }}"
          git push
