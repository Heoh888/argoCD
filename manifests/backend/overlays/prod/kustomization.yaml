apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: backend-version
    files:
      - tag=image-tag.txt
    options:
      disableNameSuffixHash: true

replacements:
  - source:
      kind: ConfigMap
      name: backend-version
      fieldPath: data.tag
    targets:
      - select:
          kind: Deployment
          name: backend
        fieldPaths:
          - spec.template.spec.containers.[name=backend].image
        options:
          delimiter: ":"
          index: 1
