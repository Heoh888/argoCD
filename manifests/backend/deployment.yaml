apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/heoh888/argocd-backend:438d6f3967a9fe992781c6a202da39d9a8e4d2ef
          ports:
            - containerPort: 8080
          envFrom:
            # только секреты — публичный конфиг в services/backend/config.py
            - secretRef:
                name: backend-secret
                optional: true
