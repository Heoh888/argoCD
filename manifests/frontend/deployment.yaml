apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Версия: services/frontend/VERSION → CI обновляет image
          image: ghcr.io/heoh888/argocd-frontend:1.0.1
          ports:
            - containerPort: 80
